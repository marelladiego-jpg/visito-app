<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visito - Assistente di Viaggio AI</title>
  <style>
    :root {
      --primary: #2D6A4F;
      --accent: #52B788;
      --bg: #F8F9FA;
      --card-bg: #FFFFFF;
      --text: #1D2D44;
      --radius: 16px;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .app-container {
      background: var(--card-bg);
      width: 100%;
      max-width: 550px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      padding: 32px;
      box-sizing: border-box;
    }

    .progress-bar-wrap {
      background: #E9ECEF;
      height: 8px;
      border-radius: 4px;
      margin-bottom: 24px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 10%;
      background: var(--primary);
      transition: width 0.3s ease;
    }

    .step-title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 8px;
      color: var(--primary);
    }

    .step-subtitle {
      font-size: 14px;
      color: #6C757D;
      margin-bottom: 24px;
    }

    .grid-options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 28px;
    }

    .option-btn {
      border: 2px solid #E9ECEF;
      border-radius: var(--radius);
      padding: 20px;
      text-align: center;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
      background: #FFFFFF;
    }

    .option-btn:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .option-btn.selected {
      border-color: var(--primary);
      background-color: #F0F7F4;
      color: var(--primary);
    }

    .btn-next {
      background-color: var(--primary);
      color: white;
      border: none;
      width: 100%;
      padding: 16px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn-next:hover {
      background-color: var(--accent);
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="progress-bar-wrap">
    <div class="progress-bar" id="pBar"></div>
  </div>
  
  <div id="wizardStep">
    <div class="step-title" id="stepTitle">Con quali mezzi preferisci spostarti?</div>
    <div class="step-subtitle" id="stepSub">Seleziona una o più opzioni (Step 1 di 10)</div>

    <div class="grid-options" id="optionsContainer">
      <div class="option-btn" onclick="toggleSelect(this)">✈️ Aereo</div>
      <div class="option-btn" onclick="toggleSelect(this)">🚆 Treno</div>
      <div class="option-btn" onclick="toggleSelect(this)">🚗 Auto propria / Noleggio</div>
      <div class="option-btn" onclick="toggleSelect(this)">🚌 Mezzi Pubblici</div>
    </div>

    <button class="btn-next" onclick="nextStep()">Continua ➔</button>
  </div>
</div>

<script>
  let currentStep = 1;
  const totalSteps = 10;

  function toggleSelect(element) {
    element.classList.toggle('selected');
  }

  function nextStep() {
    if (currentStep < totalSteps) {
      currentStep++;
      document.getElementById('pBar').style.width = (currentStep / totalSteps * 100) + '%';
      
      if (currentStep === 2) {
        document.getElementById('stepTitle').innerText = "Che tipo di alloggio preferisci?";
        document.getElementById('stepSub').innerText = "Scegli l'atmosfera per il soggiorno (Step 2 di 10)";
        document.getElementById('optionsContainer').innerHTML = `
          <div class="option-btn" onclick="toggleSelect(this)">🏨 Hotel</div>
          <div class="option-btn" onclick="toggleSelect(this)">🏡 B&B / Appartamento</div>
          <div class="option-btn" onclick="toggleSelect(this)">🌿 Agriturismo</div>
          <div class="option-btn" onclick="toggleSelect(this)">✨ Resort / Luxury</div>
        `;
      }
    } else {
      alert("Configurazione completata! Visito sta generando il tuo itinerario...");
    }
  }
</script>

</body>
</html>
